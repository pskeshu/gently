# Rig-specific UI configuration.
#
# NOTE: XY safety bounds are NOT here. They live as constants in
#   gently/hardware/dispim/devices/stage.py  (XY_STAGE_*_UM)
# and are pushed into the ASI Tiger firmware at device-layer boot. The
# Devices > Map view reads them from the live device-state stream, so
# editing those constants + restarting the device layer is the only way
# to change the safety envelope. Single source of truth.

# Optional 50x24 mm coverslip reference outline drawn on the Map. Centre is
# the stage coordinate the operator considers the coverslip centre. Drawn
# as a faint dashed rect so the operator can see the safety envelope in
# context of the physical slide. Remove this block to hide the outline.
coverslip:
  center_um: [0.0, 0.0]
  size_mm:   [50.0, 24.0]
