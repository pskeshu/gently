[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "gently"
version = "0.9.1"
description = "AI-powered control framework for diSPIM light-sheet imaging"
readme = "docs/README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Shroff Lab", email = "shroffl@nih.gov"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "anthropic>=0.39.0",
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "aiohttp>=3.9.0",
    "numpy>=1.24.0",
    "pillow>=10.0.0",
    "tifffile>=2023.0.0",
    "scipy>=1.10.0",
    "scikit-image>=0.21.0",
    "jinja2>=3.1.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
device = [
    "pymmcore>=11.1.1",
    "bluesky>=1.11.0",
    "ophyd>=1.9.0",
]
sam = [
    "torch>=2.0.0",
    "segment-anything",
]
test = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]

[project.scripts]
gently = "launch_copilot:cli_main"

[tool.setuptools.packages.find]
include = ["gently*"]
exclude = ["tests*", "benchmarks*", "scripts*", "examples*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
