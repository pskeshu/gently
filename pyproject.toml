[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gently"
version = "0.22.0.dev0"
description = "Agentic harnessing for microscopy"
readme = "docs/README.md"
license = {text = "GPL-3.0-or-later"}
requires-python = ">=3.10"
authors = [
    {name = "Kesavan Subburam", email = "pskeshu@gmail.com"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "anthropic>=0.39.0",
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "aiohttp>=3.9.0",
    "numpy>=1.24.0",
    "pillow>=10.0.0",
    "tifffile>=2023.0.0",
    "scipy>=1.10.0",
    "scikit-image>=0.21.0",
    "jinja2>=3.1.0",
    "pyyaml>=6.0",
    "matplotlib>=3.7.0",
    "python-dotenv>=1.0.0",
    # Perception harness — cloned as a sibling repo (see [tool.uv.sources])
    "gently-perception",
    # Device control
    "pymmcore>=11.1.1",
    "bluesky>=1.11.0",
    "ophyd>=1.9.0",
    # ML / SAM
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "nvidia-ml-py>=12.0.0",
    # Testing
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]

[project.optional-dependencies]
sam = [
    "segment-anything",
]
# Device-layer accessories for the microscope computer. Core hardware-control
# deps (pymmcore, bluesky, ophyd) are already in [project.dependencies]; these
# are the extras the device layer needs: BLE (SwitchBot room light), serial and
# MQTT transports (ACUITYnano thermal controller). Install: uv sync --extra device
device = [
    "bleak>=0.21.0",
    "pyserial>=3.5",
    "paho-mqtt>=1.6.0",
]

[project.scripts]
gently = "launch_gently:cli_main"

# gently-perception is not published to PyPI; it lives in a sibling clone of
# pskeshu/gently-perception and is installed editable from there.
[tool.uv.sources]
gently-perception = { path = "../gently-perception", editable = true }

[tool.setuptools.packages.find]
include = ["gently*"]
exclude = ["tests*", "benchmarks*", "scripts*", "examples*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
