[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gently"
version = "0.22.0"
description = "Agentic harnessing for microscopy"
readme = "docs/README.md"
license = {text = "GPL-3.0-or-later"}
# Upper bound from numpy<2: numpy 1.26.4 (the last 1.x) ships wheels only for
# cp310-cp312, so 3.13+ cannot resolve. pymmcore 70 itself goes to cp315.
requires-python = ">=3.10,<3.13"
authors = [
    {name = "Kesavan Subburam", email = "pskeshu@gmail.com"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "anthropic>=0.39.0",
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "aiohttp>=3.9.0",
    # numpy capped <2: pymmcore 10.1.1.70.6 is a C-extension built against the
    # numpy 1.x ABI and fails to import under numpy 2.x. The wheel declares no
    # upper bound, so we enforce it here.
    "numpy>=1.24.0,<2",
    "pillow>=10.0.0",
    "tifffile>=2023.0.0",
    "scipy>=1.10.0",
    "scikit-image>=0.21.0",
    "jinja2>=3.1.0",
    "pyyaml>=6.0",
    "matplotlib>=3.7.0",
    "python-dotenv>=1.0.0",
    # Perception harness — installed as an editable sibling clone (see
    # [tool.uv.sources]); clone gently-project/gently-perception next to this repo.
    "gently-perception",
    # Device control.
    # pymmcore pinned exactly: its MMCore must match the device-interface version
    # (70) of the Micro-Manager device adapters installed on the microscope PC.
    # Bumping this requires upgrading the MM adapter install in lockstep.
    "pymmcore==10.1.1.70.6",
    "bluesky>=1.11.0",
    "ophyd>=1.9.0",
    # NOTE: torch / torchvision / nvidia-ml-py are NOT base deps — CUDA build is
    # machine-specific. Install via an extra: `uv sync --extra torch-gpu` (CUDA
    # 11.8) or `uv sync --extra torch-cpu`. All torch imports are lazy/guarded.
    # Test/dev tooling lives in [dependency-groups] below, not here.
]

[project.optional-dependencies]
sam = [
    "segment-anything",
]
# PyTorch — CUDA build is per-machine, so it lives in mutually-exclusive extras
# wired to dedicated indexes below (see [tool.uv.sources] / [[tool.uv.index]]).
#   uv sync --extra torch-gpu   # CUDA 11.8 build (microscope / GPU box)
#   uv sync --extra torch-cpu   # CPU-only build (dev laptops, CI)
# torch-gpu pins the cu118 index: those wheels bundle their own CUDA 11.8 runtime
# and only need a recent NVIDIA driver, so the same build runs across GPU machines
# regardless of their system CUDA version.
torch-gpu = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "nvidia-ml-py>=12.0.0",
]
torch-cpu = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
]
# Device-layer accessories for the microscope computer. Core hardware-control
# deps (pymmcore, bluesky, ophyd) are already in [project.dependencies]; these
# are the extras the device layer needs: BLE (SwitchBot room light), serial and
# MQTT transports (ACUITYnano thermal controller). Install: uv sync --extra device
device = [
    "bleak>=0.21.0",
    "pyserial>=3.5",
    "paho-mqtt>=1.6.0",
]

# Test/dev tooling — installed by `uv sync` (uv enables the `dev` group by
# default) but excluded from gently's published runtime requirements.
[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.4.0",
    "pre-commit>=3.7.0",
    # Pinned so local runs, the pre-commit hook, and CI all use the same
    # mypy. Keep in sync with the mirrors-mypy rev in .pre-commit-config.yaml
    # and the install step in .github/workflows/lint.yml.
    "mypy==2.1.0",
]

[project.scripts]
gently = "launch_gently:cli_main"

# torch-gpu and torch-cpu extras are mutually exclusive — they pull torch/
# torchvision from different indexes, so they can't be installed together.
[tool.uv]
conflicts = [
    [{ extra = "torch-gpu" }, { extra = "torch-cpu" }],
]

# gently-perception is not published to PyPI; clone gently-project/gently-perception
# as a sibling of this repo and it is installed editable from there — so your edits
# are live immediately. A missing sibling makes `uv sync` fail by design; clone it.
# torch/torchvision are routed to a CUDA or CPU index depending on the extra.
[tool.uv.sources]
gently-perception = { path = "../gently-perception", editable = true }
torch = [
    { index = "pytorch-cu118", extra = "torch-gpu" },
    { index = "pytorch-cpu", extra = "torch-cpu" },
]
torchvision = [
    { index = "pytorch-cu118", extra = "torch-gpu" },
    { index = "pytorch-cpu", extra = "torch-cpu" },
]

[[tool.uv.index]]
name = "pytorch-cu118"
url = "https://download.pytorch.org/whl/cu118"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.setuptools.packages.find]
include = ["gently*"]
exclude = ["tests*", "benchmarks*", "scripts*", "examples*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
explicit_package_bases = true
mypy_path = "."

# Modules with pre-existing mypy errors, exempted while the codebase is
# incrementally annotated (see issue #46). New modules should not be added
# here; PRs that substantively touch a listed module should fix its errors
# and remove it from this list as part of that change.
[[tool.mypy.overrides]]
module = [
    "benchmarks.perception.live_viewer",
    "benchmarks.perception.metrics",
    "benchmarks.perception.testset",
    "diagnostics.benchmark_gentlystore_fps",
    "diagnostics.benchmark_volume_fps",
    "diagnostics.plot_benchmark_results",
    "diagnostics.switchbot_webgui",
    "examples.example_dispim_workflows",
    "gently",
    "gently.agent",
    "gently.analysis.core",
    "gently.analysis.steps",
    "gently.app.agent",
    "gently.app.benchmark",
    "gently.app.calibration.edge_roi",
    "gently.app.detectors.dopaminergic_signal",
    "gently.app.orchestration.timelapse",
    "gently.app.video_maker",
    "gently.core.store",
    "gently.dataset.aggregator",
    "gently.dataset.embryo_dataset",
    "gently.dataset.explorer_server",
    "gently.detection",
    "gently.eval.decision_log",
    "gently.eval.event_capture",
    "gently.gently",
    "gently.hardware.dispim.client",
    "gently.hardware.dispim.device_factory",
    "gently.hardware.dispim.device_layer",
    "gently.hardware.dispim.devices.acquisition",
    "gently.hardware.dispim.devices.camera",
    "gently.hardware.dispim.devices.test_temperature_controller",
    "gently.hardware.dispim.plans.acquisition",
    "gently.hardware.dispim.sam_detection",
    "gently.hardware.switchbot",
    "gently.log_config",
    "gently.ml.data_loader",
    "gently.ml.federated",
    "gently.organisms.celegans.developmental_tracker",
    "gently.ui.web.routes.agent_ws",
    "gently.ui.web.routes.campaigns",
    "gently.ui.web.routes.data",
    "gently.ui.web.routes.volumes",
    "gently.ui.web.routes.websocket",
    "gently.ui.web.strategy_snapshot",
    "launch_gently",
    "scripts.auto_label_examples",
    "scripts.extract_stage_examples",
    "scripts.gemini_stage_test",
    "scripts.launch_viz_server",
    "scripts.projection_explorer",
    "scripts.replay_session",
    "scripts.stage_annotator",
    "tests.test_campaign_coordination",
    "tests.test_text_tool_call_extraction",
    "tests.validate_recursive_autofocus",
]
ignore_errors = true
