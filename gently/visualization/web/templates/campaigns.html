<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gently - Campaigns</title>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <link rel="stylesheet" href="/static/css/main.css">
    <link rel="stylesheet" href="/static/css/campaigns.css">
</head>
<body>
    <script>
        const savedTheme = localStorage.getItem('gently-theme') || 'dark';
        document.body.setAttribute('data-theme', savedTheme);
    </script>
    <div class="header">
        <div class="header-left">
            <h1>Campaigns</h1>
            <span class="header-subtitle" id="campaign-count"></span>
        </div>
        <div class="header-right">
            <a href="/" class="back-to-live">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M19 12H5M12 19l-7-7 7-7"/>
                </svg>
                Back to Live
            </a>
            <button class="theme-toggle" id="theme-toggle" title="Toggle theme">
                <svg class="theme-icon sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="5"></circle>
                    <line x1="12" y1="1" x2="12" y2="3"></line>
                    <line x1="12" y1="21" x2="12" y2="23"></line>
                    <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                    <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                    <line x1="1" y1="12" x2="3" y2="12"></line>
                    <line x1="21" y1="12" x2="23" y2="12"></line>
                    <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                    <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                </svg>
                <svg class="theme-icon moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                </svg>
            </button>
        </div>
    </div>

    <div class="campaigns-container" id="campaigns-container">
        <div class="loading-state" id="loading-state">
            <div class="loading-spinner"></div>
            <p>Loading campaigns...</p>
        </div>
        <div class="empty-state hidden" id="empty-state">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                <path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2"/>
                <rect x="9" y="3" width="6" height="4" rx="1"/>
                <line x1="9" y1="12" x2="15" y2="12"/>
                <line x1="9" y1="16" x2="13" y2="16"/>
            </svg>
            <p>No campaigns yet</p>
            <span class="empty-hint">Use plan mode in the TUI to create experimental plans</span>
        </div>
        <div class="campaign-list" id="campaign-list">
            <!-- Rendered by campaigns.js -->
        </div>
    </div>

    <!-- Detail panel (slides in from right) -->
    <div class="detail-panel hidden" id="detail-panel">
        <div class="detail-header">
            <button class="detail-close" id="detail-close" title="Close">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </button>
            <h2 id="detail-title"></h2>
            <span class="detail-status" id="detail-status"></span>
        </div>
        <div class="detail-body" id="detail-body">
            <!-- Rendered dynamically -->
        </div>
    </div>

    <script src="/static/js/campaigns.js"></script>
</body>
</html>
