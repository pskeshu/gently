<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gently - Campaigns</title>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <link rel="stylesheet" href="/static/css/main.css">
    <link rel="stylesheet" href="/static/css/campaigns.css">
</head>
<body>
    <script>
        const savedTheme = localStorage.getItem('gently-theme') || 'dark';
        document.body.setAttribute('data-theme', savedTheme);
    </script>

    <div class="header">
        <div class="header-left">
            <a href="/" class="back-to-live">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
                Live
            </a>
            <h1 id="header-title">Campaigns</h1>
            <span class="header-breadcrumb" id="header-breadcrumb"></span>
        </div>
        <div class="header-right">
            <div class="version-wrap hidden" id="version-wrap">
                <button class="hdr-btn" id="version-btn">
                    <span id="version-label">Current</span>
                    <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6,9 12,15 18,9"/></svg>
                </button>
                <div class="version-dropdown hidden" id="version-dropdown"></div>
            </div>
            <button class="hdr-btn hidden" id="print-btn" title="Print plan">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 01-2-2v-5a2 2 0 012-2h16a2 2 0 012 2v5a2 2 0 01-2 2h-2"/><rect x="6" y="14" width="12" height="8"/>
                </svg>
                Print
            </button>
            <button class="theme-toggle" id="theme-toggle" title="Toggle theme">
                <svg class="theme-icon sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/>
                    <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
                    <line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/>
                    <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
                </svg>
                <svg class="theme-icon moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
                </svg>
            </button>
        </div>
    </div>

    <!-- Snapshot banner (viewing past version) -->
    <div class="snapshot-banner hidden" id="snapshot-banner">
        <span id="snapshot-banner-text"></span>
        <button class="snapshot-close" id="snapshot-close">Back to current</button>
    </div>

    <div class="workspace" id="workspace">
        <nav class="navigator" id="navigator">
            <div class="nav-content" id="nav-content"></div>
        </nav>
        <main class="canvas" id="canvas">
            <div class="canvas-loading" id="canvas-loading">
                <div class="loading-spinner"></div>
                <p>Loading campaigns...</p>
            </div>
            <div class="canvas-content" id="canvas-content"></div>
        </main>
        <aside class="inspector" id="inspector">
            <div class="inspector-header">
                <button class="inspector-close" id="inspector-close" title="Close">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
                    </svg>
                </button>
                <h2 id="inspector-title"></h2>
                <span class="inspector-status" id="inspector-status"></span>
            </div>
            <div class="inspector-body" id="inspector-body"></div>
        </aside>
    </div>

    <footer class="statusbar" id="statusbar">
        <span id="status-left"></span>
        <span id="status-right"></span>
    </footer>

    <script>window.INITIAL_CAMPAIGN_ID = "{{ campaign_id }}";</script>
    <script src="/static/js/campaigns.js"></script>
</body>
</html>
