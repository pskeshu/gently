<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in · Gently</title>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0d1117; --bg-card: #161b22; --border: #30363d;
            --text: #c9d1d9; --text-muted: #8b949e; --accent: #60a5fa;
            --accent-hover: #93c5fd; --danger: #f87171;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0; min-height: 100vh;
            display: flex; align-items: center; justify-content: center;
            background: var(--bg-dark); color: var(--text);
            font-family: 'Inter Tight', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }
        .card {
            width: 340px; max-width: calc(100vw - 40px);
            background: var(--bg-card); border: 1px solid var(--border);
            border-radius: 14px; padding: 28px 26px;
            box-shadow: 0 16px 50px rgba(0, 0, 0, 0.5);
        }
        .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
        .brand img { display: block; }
        .brand h1 { font-size: 20px; font-weight: 600; margin: 0; }
        .sub { color: var(--text-muted); font-size: 13px; margin: 0 0 22px; }
        label { display: block; font-size: 12px; color: var(--text-muted); margin: 14px 0 5px; }
        input {
            width: 100%; padding: 10px 12px; border-radius: 9px;
            border: 1px solid var(--border); background: var(--bg-dark);
            color: var(--text); font-size: 14px; font-family: inherit;
        }
        input:focus { outline: none; border-color: var(--accent); }
        button {
            width: 100%; margin-top: 22px; padding: 11px;
            border: none; border-radius: 9px;
            background: var(--accent); color: #fff;
            font-weight: 600; font-size: 14px; cursor: pointer;
        }
        button:hover:not(:disabled) { background: var(--accent-hover); }
        button:disabled { opacity: 0.6; cursor: default; }
        .error { color: var(--danger); font-size: 13px; margin-top: 14px; min-height: 18px; }
        .divider {
            display: flex; align-items: center; gap: 10px;
            margin: 18px 0 0; color: var(--text-muted);
            font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em;
        }
        .divider::before, .divider::after {
            content: ""; flex: 1; height: 1px; background: var(--border);
        }
        .ghost {
            display: block; width: 100%; margin-top: 14px; padding: 10px;
            text-align: center; border: 1px solid var(--border);
            border-radius: 9px; background: transparent; color: var(--text);
            font-size: 13.5px; font-weight: 500; text-decoration: none;
        }
        .ghost:hover { border-color: var(--accent); color: var(--accent-hover); }
        .alt-note {
            margin: 12px 0 0; color: var(--text-muted);
            font-size: 12px; line-height: 1.5; text-align: center;
        }
    </style>
</head>
<body>
    <form class="card" id="login-form" autocomplete="on">
        <div class="brand">
            <img src="/static/favicon.svg" alt="" width="30" height="30">
            <h1>Gently</h1>
        </div>
        <p class="sub">Sign in to control the microscope — or keep watching in view-only mode.</p>
        <label for="username">Username</label>
        <input id="username" name="username" type="text" autocomplete="username" autofocus required>
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
        <button type="submit" id="submit">Sign in</button>
        <div class="error" id="error"></div>
        <div class="divider">or</div>
        <a class="ghost" href="/">Continue without signing in →</a>
        <p class="alt-note">View-only: watch live sessions and imagery. You can sign in any time to take control.</p>
    </form>
    <script>
        const form = document.getElementById('login-form');
        const errEl = document.getElementById('error');
        const btn = document.getElementById('submit');
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            errEl.textContent = '';
            btn.disabled = true;
            try {
                const r = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username: document.getElementById('username').value,
                        password: document.getElementById('password').value,
                    }),
                });
                if (r.ok) { window.location.href = '/'; return; }
                const data = await r.json().catch(() => ({}));
                errEl.textContent = data.error || 'Sign in failed';
            } catch (_) {
                errEl.textContent = 'Could not reach the server';
            }
            btn.disabled = false;
        });
    </script>
    {% if replay_enabled %}
    <script src="/static/vendor/rrweb/rrweb.umd.min.js" defer></script>
    <script src="/static/js/replay-recorder.js" defer data-gently-replay-fidelity="{{ replay_fidelity }}"></script>
    {% endif %}
</body>
</html>
