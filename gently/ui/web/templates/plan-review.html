<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gently - Plan Review</title>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <link rel="stylesheet" href="/static/css/main.css">
    <link rel="stylesheet" href="/static/css/plan-review.css">
</head>
<body class="plan-review-page">
    <script>
        const savedTheme = localStorage.getItem('gently-theme') || 'dark';
        document.body.setAttribute('data-theme', savedTheme);
    </script>

    <!-- Snapshot banner — positioned fixed, outside grid -->
    <div class="snapshot-banner hidden" id="snapshot-banner">
        <span id="snapshot-banner-text">Viewing snapshot</span>
        <button class="snapshot-banner-close" id="snapshot-banner-close">Back to current</button>
    </div>

    <!-- Hamburger — positioned fixed, outside grid -->
    <button class="outline-hamburger" id="outline-hamburger" title="Show outline">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <line x1="3" y1="12" x2="21" y2="12"></line>
            <line x1="3" y1="18" x2="21" y2="18"></line>
        </svg>
    </button>

    <!-- Main 3-panel grid — only 5 direct children, one per area -->
    <div class="plan-review" id="plan-review">
        <!-- Header -->
        <header class="plan-header">
            <div class="plan-header-left">
                <a href="/campaigns" class="back-link">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M19 12H5M12 19l-7-7 7-7"/>
                    </svg>
                    Campaigns
                </a>
                <h1 class="plan-header-title" id="plan-title">Loading...</h1>
            </div>
            <div class="plan-header-right">
                <button class="plan-btn" id="print-btn" title="Print plan">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="6 9 6 2 18 2 18 9"></polyline>
                        <path d="M6 18H4a2 2 0 01-2-2v-5a2 2 0 012-2h16a2 2 0 012 2v5a2 2 0 01-2 2h-2"></path>
                        <rect x="6" y="14" width="12" height="8"></rect>
                    </svg>
                    Print
                </button>
                <div class="version-dropdown-wrap" id="version-dropdown-wrap">
                    <button class="plan-btn version-btn" id="version-btn">
                        <span id="version-label">Current</span>
                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polyline points="6,9 12,15 18,9"></polyline>
                        </svg>
                    </button>
                    <div class="version-dropdown hidden" id="version-dropdown"></div>
                </div>
                <button class="theme-toggle" id="theme-toggle" title="Toggle theme">
                    <svg class="theme-icon sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="5"></circle>
                        <line x1="12" y1="1" x2="12" y2="3"></line>
                        <line x1="12" y1="21" x2="12" y2="23"></line>
                        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                        <line x1="1" y1="12" x2="3" y2="12"></line>
                        <line x1="21" y1="12" x2="23" y2="12"></line>
                        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                    </svg>
                    <svg class="theme-icon moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                    </svg>
                </button>
            </div>
        </header>

        <!-- Left: Outline -->
        <nav class="plan-outline" id="plan-outline">
            <div class="outline-content" id="outline-content"></div>
        </nav>

        <!-- Center: Document -->
        <main class="plan-document" id="plan-document">
            <div class="doc-loading" id="doc-loading">
                <div class="loading-spinner"></div>
                <p>Loading plan...</p>
            </div>
            <div class="doc-content" id="doc-content"></div>
        </main>

        <!-- Right: Detail -->
        <aside class="plan-detail" id="plan-detail">
            <div class="detail-panel-header">
                <button class="detail-close" id="detail-close" title="Close">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
                <h2 id="detail-title"></h2>
                <span class="detail-status-badge" id="detail-status"></span>
            </div>
            <div class="detail-body" id="detail-body"></div>
        </aside>

        <!-- Footer -->
        <footer class="plan-footer" id="plan-footer">
            <span id="footer-stats">Loading...</span>
            <span id="footer-snapshot"></span>
        </footer>
    </div>

    <script>
        window.CAMPAIGN_ID = "{{ campaign_id }}";
    </script>
    <script src="/static/js/plan-review.js"></script>
</body>
</html>
