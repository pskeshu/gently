[package]
name = "gently-desktop"
version = "0.1.0"
edition = "2021"
description = "Gently desktop shell — owns the Python backend + device layer"
authors = ["gently"]
default-run = "gently-desktop"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2" }

# Windows Job Object: put the spawned Python (and its device-layer grandchild)
# in a kill-on-close job so the whole tree dies when the shell exits or crashes.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_Security",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
